<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SenSante - Pre-diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <header class="bg-blue-600 text-white py-4 shadow-lg">
      <div class="max-w-4xl mx-auto px-4">
        <h1 class="text-2xl font-bold">SenSante</h1>
        <p class="text-blue-100 text-sm">Assistant pre-diagnostic medical</p>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
      <div id="grid-principal" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div id="form-section" class="bg-white rounded-xl shadow-md p-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4">
            Symptomes du patient
          </h2>

          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Age</label
            >
            <input
              type="number"
              id="age"
              class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="Ex: 28"
              min="0"
              max="120"
            />
          </div>

          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Sexe</label
            >
            <select
              id="sexe"
              class="w-full border border-gray-300 rounded-lg p-2"
            >
              <option value="F">Feminin</option>
              <option value="M">Masculin</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Temperature (C)</label
            >
            <input
              type="number"
              id="temperature"
              step="0.1"
              class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="Ex: 38.5"
              min="35"
              max="42"
            />
          </div>

          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Tension systolique</label
            >
            <input
              type="number"
              id="tension_sys"
              class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="Ex: 120"
              min="60"
              max="250"
            />
          </div>

          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Symptomes</label
            >
            <div class="space-y-2">
              <label class="flex items-center">
                <input
                  type="checkbox"
                  id="toux"
                  class="rounded text-blue-600 mr-2"
                />
                <span class="text-gray-700">Toux</span>
              </label>
              <label class="flex items-center">
                <input
                  type="checkbox"
                  id="fatigue"
                  class="rounded text-blue-600 mr-2"
                />
                <span class="text-gray-700">Fatigue</span>
              </label>
              <label class="flex items-center">
                <input
                  type="checkbox"
                  id="maux_tete"
                  class="rounded text-blue-600 mr-2"
                />
                <span class="text-gray-700">Maux de tete</span>
              </label>
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Region</label
            >
            <select
              id="region"
              class="w-full border border-gray-300 rounded-lg p-2"
            >
              <option value="Dakar">Dakar</option>
              <option value="Thies">Thies</option>
              <option value="Saint-Louis">Saint-Louis</option>
              <option value="Ziguinchor">Ziguinchor</option>
              <option value="Tambacounda">Tambacounda</option>
              <option value="Kaolack">Kaolack</option>
              <option value="Diourbel">Diourbel</option>
              <option value="Fatick">Fatick</option>
              <option value="Kolda">Kolda</option>
              <option value="Matam">Matam</option>
            </select>
          </div>

          <button
            onclick="diagnostiquer()"
            id="btn-diag"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md"
          >
            Diagnostiquer
          </button>
        </div>

        <div id="result-section">
          <div
            class="bg-white rounded-xl shadow-md p-6 text-center text-gray-400"
          >
            <p class="text-4xl mb-3">🩺</p>
            <p class="font-medium">Remplissez le formulaire</p>
            <p class="text-sm mt-1">puis cliquez sur Diagnostiquer</p>
          </div>
        </div>
      </div>

      <div
        id="historique-section"
        class="hidden bg-white rounded-xl shadow-md p-6 mt-6"
      >
        <h2 class="text-xl font-bold text-gray-800 mb-4">
          📋 Historique des consultations
        </h2>
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-gray-100 text-gray-600">
              <th class="p-2 text-left">#</th>
              <th class="p-2 text-left">Diagnostic</th>
              <th class="p-2 text-left">Probabilite</th>
            </tr>
          </thead>
          <tbody id="historique-body"></tbody>
        </table>
      </div>
    </main>

    <footer class="text-center text-gray-400 text-sm py-4">
      SenSante v0.3 - ESP/UCAD - L2 GLSI 2026
    </footer>

    <script>
      const API_URL = "http://localhost:8000";
      const historique = [];

      async function diagnostiquer() {
        const patient = {
          age: parseInt(document.getElementById("age").value),
          sexe: document.getElementById("sexe").value,
          temperature: parseFloat(document.getElementById("temperature").value),
          tension_sys: parseInt(document.getElementById("tension_sys").value),
          toux: document.getElementById("toux").checked,
          fatigue: document.getElementById("fatigue").checked,
          maux_tete: document.getElementById("maux_tete").checked,
          region: document.getElementById("region").value,
        };

        if (!patient.age || !patient.temperature || !patient.tension_sys) {
          afficherErreur("Veuillez remplir tous les champs.");
          return;
        }

        afficherChargement();

        try {
          const response = await fetch(API_URL + "/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(patient),
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(
              err.detail ? JSON.stringify(err.detail) : "Erreur serveur",
            );
          }

          const resultat = await response.json();
          // Passer également l'objet initial patient pour construire la requête /explain
          afficherResultat(resultat, patient);
        } catch (error) {
          afficherErreur("Erreur de connexion : " + error.message);
        }
      }

      function afficherChargement() {
        const section = document.getElementById("result-section");
        section.innerHTML = `
            <div class="bg-white rounded-xl shadow-md p-6 text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                <p class="text-gray-500">Analyse en cours...</p>
            </div>`;
      }

      function afficherResultat(r, patientData) {
        const couleurs = {
          palu: {
            bg: "bg-red-100",
            text: "text-red-800",
            bar: "bg-red-500",
            badge: "bg-red-500",
          },
          grippe: {
            bg: "bg-orange-100",
            text: "text-orange-800",
            bar: "bg-orange-500",
            badge: "bg-orange-500",
          },
          typh: {
            bg: "bg-yellow-100",
            text: "text-yellow-800",
            bar: "bg-yellow-500",
            badge: "bg-yellow-500",
          },
          sain: {
            bg: "bg-green-100",
            text: "text-green-800",
            bar: "bg-green-500",
            badge: "bg-green-500",
          },
        };

        const icones = {
          palu: "🦟",
          grippe: "🤧",
          typh: "🌡️",
          sain: "✅",
        };

        const c = couleurs[r.diagnostic] || couleurs["sain"];
        const icone = icones[r.diagnostic] || "❓";
        const pct = Math.round(r.probabilite * 100);

        // Intégration de la zone d'affichage <div id="llm-explanation">
        document.getElementById("result-section").innerHTML = `
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Resultat</h2>
                <div class="${c.bg} rounded-lg p-4 mb-4">
                    <p class="text-sm text-gray-600">Diagnostic :</p>
                    <p class="text-2xl font-bold ${c.text} uppercase mt-1">${icone} ${r.diagnostic}</p>
                </div>
                <div class="mb-4">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm text-gray-600">Probabilite</span>
                        <span class="text-sm font-bold ${c.text}">${pct}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3">
                        <div class="${c.bar} h-3 rounded-full transition-all duration-500"
                            style="width: ${pct}%"></div>
                    </div>
                </div>
                <div class="flex items-center gap-2 mb-3">
                    <span class="${c.badge} text-white text-xs px-2 py-1 rounded-full">${r.confiance}</span>
                    <span class="text-sm text-gray-600">confiance</span>
                </div>
                <div class="bg-gray-50 rounded-lg p-3 mb-4">
                    <p class="text-sm text-gray-700">${r.message}</p>
                </div>
                
                <div id="llm-explanation" class="border-t pt-4">
                    <div class="flex items-center gap-2 text-gray-500 text-sm">
                        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-gray-500"></div>
                        <em>Llama 3 genere une explication medicale...</em>
                    </div>
                </div>
            </div>`;

        // Ajouter a l'historique
        historique.unshift({
          diagnostic: r.diagnostic,
          probabilite: pct,
          icone: icone,
        });
        if (historique.length > 5) historique.pop();
        afficherHistorique();

        // Lancement immédiat de l'explication après rendu du conteneur
        expliquerDiagnostic(r, patientData);
      }

      // Nouvelle fonction JavaScript pour appeler l'endpoint /explain
      async function expliquerDiagnostic(result, patientData) {
        const explainDiv = document.getElementById("llm-explanation");

        try {
          const response = await fetch(API_URL + "/explain", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              diagnostic: result.diagnostic,
              probabilite: result.probabilite,
              age: patientData.age,
              sexe: patientData.sexe,
              temperature: patientData.temperature,
              region: patientData.region,
            }),
          });

          if (response.ok) {
            const explainResult = await response.json();
            if (explainDiv) {
              explainDiv.innerHTML = `
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mt-2 text-left">
                  <h5 class="text-sm font-bold text-blue-900 mb-1">💡 Explication de l'assistant (Llama 3) :</h5>
                  <p class="text-sm text-blue-800 leading-relaxed mb-2">${explainResult.explication}</p>
                  <p class="text-[10px] text-gray-400 text-right">Modele : ${explainResult.modele_llm}</p>
                </div>
              `;
            }
          } else {
            if (explainDiv) {
              explainDiv.innerHTML =
                "<p class='text-xs text-red-500'>Erreur lors de la recuperation de l'explication.</p>";
            }
          }
        } catch (err) {
          console.error("Erreur /explain:", err);
          if (explainDiv) {
            explainDiv.innerHTML =
              "<p class='text-xs text-red-500'>Impossible de contacter le service d'explication.</p>";
          }
        }
      }

      function afficherHistorique() {
        const section = document.getElementById("historique-section");
        const tbody = document.getElementById("historique-body");

        tbody.innerHTML = historique
          .map(
            (h, i) => `
            <tr class="border-t">
                <td class="p-2">${i + 1}</td>
                <td class="p-2">${h.icone} ${h.diagnostic.toUpperCase()}</td>
                <td class="p-2">${h.probabilite}%</td>
            </tr>`,
          )
          .join("");

        section.classList.remove("hidden");
      }

      function afficherErreur(msg) {
        document.getElementById("result-section").innerHTML = `
            <div class="bg-red-50 border border-red-200 rounded-xl p-6">
                <p class="text-red-700 font-medium">${msg}</p>
                <p class="text-red-500 text-sm mt-2">Verifiez votre connexion et reessayez.</p>
            </div>`;
      }
    </script>
  </body>
</html>
